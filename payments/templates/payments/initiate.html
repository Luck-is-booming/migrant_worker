{% load i18n %}
<!DOCTYPE html>
<html lang="{{ request.LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <title>{% trans "Redirecting to eSewa..." %}</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 100px; background: #f4f6f9; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #60b82d; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h2>{% trans "Redirecting to eSewa for payment, please wait..." %}</h2>
    <div class="loader"></div>

    <form action="{{ initiate_url }}" method="POST" id="esewa-form">
        {% for key, value in form_data.items %}
            <input type="hidden" name="{{ key }}" value="{{ value }}">
        {% endfor %}
    </form>

    <script>
        document.getElementById("esewa-form").submit();
    </script>
</body>
</html>
