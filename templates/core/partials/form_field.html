{% load i18n %}
<div class="form-group{% if full %} form-group--full{% endif %}{% if field.errors %} form-group--error{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <div class="checkbox-row">
      {{ field }}
      <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required-mark" aria-hidden="true">*</span><span class="sr-only"> ({% translate "required" %})</span>{% endif %}</label>
    </div>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required-mark" aria-hidden="true">*</span><span class="sr-only"> ({% translate "required" %})</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="helptext" id="{{ field.id_for_label }}-help">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<ul class="errorlist" id="{{ field.id_for_label }}-errors">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
