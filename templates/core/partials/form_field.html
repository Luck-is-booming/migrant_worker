<div class="form-group {% if full %}form-group--full{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <div class="checkbox-row">{{ field }} <label for="{{ field.id_for_label }}">{{ field.label }}</label></div>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="helptext" id="{{ field.id_for_label }}-help">{{ field.help_text }}</div>{% endif %}
  {{ field.errors }}
</div>
